name: Crimson
options:
  bundleIdPrefix: com.crimson
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Crimson:
    type: application
    platform: iOS
    sources: [Crimson]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crimson.remote
        PRODUCT_NAME: Crimson
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crimson
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Crimson finds and controls your TV on this Wi-Fi."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGNING_ALLOWED: NO
