name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project Crimson.xcodeproj -scheme Crimson -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build | tee build.log | xcpretty || (grep -E "error:" build.log | head -50; exit 1)

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/Crimson.app Payload/
          zip -qr Crimson.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Crimson-ipa
          path: ios/Crimson.ipa
