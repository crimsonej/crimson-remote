name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Crimson.xcodeproj -scheme Crimson -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build 2>&1 | tee build.log | xcpretty \
            || { grep -E "error:" build.log | sort -u | head -50; exit 1; }

      - name: Package IPA
        run: |
          cd ios
          APP=build/Release-iphoneos/Crimson.app
          # Refuse to publish an incomplete app.
          test -f "$APP/Info.plist" || { echo "Info.plist missing"; exit 1; }
          test -f "$APP/Crimson" || { echo "App binary missing"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Crimson.ipa Payload
          unzip -l Crimson.ipa | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: Crimson-ipa
          path: ios/Crimson.ipa
